[package]
name = "pulpo-shell"
version = "0.1.0"
description = "pulpo — 多渠道 agent 编排壳"
authors = ["pulpo"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "pulpo_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
